server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8787;
    listen [::]:8787;
    server_name _;

    client_max_body_size 25M;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript application/json application/octet-stream text/css text/javascript;

    # Agent replies are streamed token by token; buffering would hold them until the whole answer is done.
    location /api/demo/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
