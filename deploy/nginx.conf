server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8787;
    listen [::]:8787;
    server_name _;

    client_max_body_size 25M;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript application/json application/octet-stream text/css text/javascript;

    # /joc without a slash was redirected by the app to port 80, because the
    # proxy Host header dropped :8787. Browsers then sat on a blank "Loading..."
    # tab whenever port 80 was not the address the user opened.
    location = /joc {
        return 308 $scheme://$http_host/joc/;
    }

    # Godot's web HTTP client does not decompress gzip. Replies under 1KB stayed
    # plain and arrived; a longer onboarding reply was compressed and the game
    # showed "Conexiunea cu serverul a fost întreruptă" even though the API returned 200.
    location /api/ {
        gzip off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Agent replies are streamed token by token; buffering would hold them until the whole answer is done.
    location /api/demo/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        gzip off;
    }

    # The web export is a 39MB wasm. Gzip and proxy buffering delay the first
    # bytes and can stall the loader on a black page.
    location /joc/ {
        gzip off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
