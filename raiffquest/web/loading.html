<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <!-- Project-owned starting point, not the platform default. Customize the presentation below. -->
<style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #ddd; font-family: system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #111; text-align: center; }
    #loading[hidden], [hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(20px, 5vw, 32px); overflow-wrap: anywhere; }
    p { margin: 0; }
    progress { width: min(320px, 75vw); justify-self: center; }
    button { justify-self: center; padding: 12px 24px; cursor: pointer; font: inherit; }
  </style>
<style>#loading-notice { max-width: 360px; justify-self: center; line-height: 1.5; }</style>





  <style id="loading-art">
    html, body { background: #14171c; color: #f4f4ef; }
    #loading { box-sizing: border-box; overflow: auto; place-content: center; gap: 14px; text-align: center; background: #14171c; }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    #loading-icon { width: 72px; height: 72px; margin: 0 auto 4px; display: block; }
    #loading h1 { font-weight: 700; font-size: clamp(28px, 5vw, 46px); letter-spacing: 0.04em; color: #ffe600; }
    #loading-status { font-weight: 500; }
    #loading progress { display: block; width: min(320px, 75vw); height: 7px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #ffe600; background: #ffffff26; }
    #loading progress::-webkit-progress-bar { background: #ffffff26; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #ffe600; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #ffe600; border-radius: 20px; }
    #loading button { min-height: 44px; border: 1px solid #ffe600; border-radius: 10px; background: #14171c; color: #f4f4ef; }
    #loading button:focus-visible { outline: 3px solid #ffe600; outline-offset: 4px; }
    #loading [hidden] { display: none; }
  </style>
</head>

    <h1 id="game-title"></h1>
    <p id="loading-status">Se încarcă…</p>
    <progress id="loading-progress" aria-label="Progres descărcare"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Reîncearcă</button>
    <noscript>Este necesar JavaScript pentru a juca.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      document.getElementById('game-title').textContent = document.title;
      // No saved game preference is visible here: follow the browser's preferred language.
      let en = false;
      try { en = localStorage.getItem('raiffquest.locale') === 'en'; } catch (_) {}
      document.documentElement.lang = en ? 'en' : 'ro';
      status.textContent = (en ? 'Loading…' : 'Se încarcă…');
      retry.textContent = (en ? 'Try again' : 'Reîncearcă');
      progress.setAttribute('aria-label', (en ? 'Download progress' : 'Progres descărcare'));
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? (en ? 'There has been no progress recently. You can wait or try again.' : 'Nu a apărut progres recent. Poți aștepta sau reîncerca.')
          : (en ? 'Still loading. You can wait or try again.' : 'Se încarcă în continuare. Poți aștepta sau reîncerca.');
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      // Time alone cannot prove failure: downloads and WASM compilation may be slow.
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = (en ? 'The game could not load. Please try again.' : 'Nu s-a putut încărca jocul. Încearcă din nou.');
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = (en ? 'Loading…' : 'Se încarcă…');
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? (en ? 'Starting the game…' : 'Se pornește jocul…')
          : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads }).filter((item) => {
            // The demo is opened over http://IP:8787. WebGL and WASM run there;
            // only threads would actually need a secure context.
            return threads || !item.startsWith('Secure Context');
          });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
