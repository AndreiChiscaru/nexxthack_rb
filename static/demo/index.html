<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raiff Quest — demo agenți AI</title>
  <link rel="stylesheet" href="/static/demo/demo.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">RQ</span> Raiff Quest <small>demo agenți AI</small></div>
    <div id="hud" class="hud hidden"></div>
    <button id="reset" class="ghost" title="Începe o sesiune nouă">↺ Sesiune nouă</button>
  </header>

  <!-- View 1: onboarding agent (+ statement agent) -->
  <main id="view-onboarding" class="view hidden">
    <section class="panel chat-panel">
      <h2>1 · Hai să-ți construim parcursul</h2>
      <p class="hint">Agentul de onboarding îți pune câteva întrebări. Încarcă un extras de cont (📎) și agentul de analiză îi trimite datele.</p>
      <div id="onb-chat" class="chat"></div>
      <form id="onb-form" class="composer">
        <label class="attach" title="Încarcă extras de cont (PDF / imagine)">📎<input id="onb-file" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.txt,.csv" hidden></label>
        <input id="onb-input" autocomplete="off" placeholder="Scrie un răspuns…">
        <button type="submit">Trimite</button>
      </form>
    </section>
    <aside class="panel profile-panel">
      <h2>Profilul tău</h2>
      <div id="profile-progress" class="progress"><div></div></div>
      <p id="profile-missing" class="hint"></p>
      <div id="statement-card" class="statement hidden"></div>
      <dl id="profile-fields" class="fields"></dl>
      <button id="start-game" class="primary" disabled>Începe jocul ▶</button>
    </aside>
  </main>

  <!-- View 2: demo game -->
  <main id="view-game" class="view hidden">
    <section class="goal-bar panel">
      <div>
        <div class="goal-title" id="goal-title"></div>
        <div class="progress big" id="goal-progress"><div></div></div>
        <div class="hint" id="goal-meta"></div>
      </div>
      <button id="next-month" class="primary">Luna următoare ▶</button>
    </section>
    <section id="event" class="event panel hidden"></section>
    <div class="game-layout">
      <section id="institutions" class="institutions"></section>
      <aside class="panel log-panel">
        <h3>Jurnal</h3>
        <ul id="log" class="log"></ul>
      </aside>
    </div>
  </main>

  <!-- Agent 3: consultant popup -->
  <button id="consultant-fab" class="fab hidden" title="Consultantul financiar">💬<span>Consultant</span></button>
  <section id="consultant" class="popup hidden">
    <header><strong>💬 Consultant financiar AI</strong><button class="ghost close" data-close="consultant">✕</button></header>
    <div id="cons-chat" class="chat"></div>
    <div class="suggestions" id="cons-suggestions"></div>
    <form id="cons-form" class="composer">
      <input id="cons-input" autocomplete="off" placeholder="Întreabă consultantul…">
      <button type="submit">Trimite</button>
    </form>
  </section>

  <!-- Agent 4: business accountant modal -->
  <div id="business" class="modal hidden">
    <section class="modal-box">
      <header><strong>🏢 Afacere · Contabil AI</strong><button class="ghost close" data-close="business">✕</button></header>
      <div id="biz-chat" class="chat"></div>
      <div class="suggestions" id="biz-suggestions"></div>
      <form id="biz-form" class="composer">
        <label class="attach" title="Încarcă un document (plan de afaceri, factură, contract)">📎<input id="biz-file" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.txt,.csv" hidden></label>
        <input id="biz-input" autocomplete="off" placeholder="Descrie afacerea sau întreabă despre taxe…">
        <button type="submit">Trimite</button>
      </form>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/demo/demo.js"></script>
</body>
</html>
